<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    
    <!-- Natively.io SDK - CDN provides window.natively bridge for native app -->
    <script>
      window.nativelyLoaded = false;
      function nativelyOnLoad() {
        window.nativelyLoaded = true;
        if (window.natively) window.natively.setDebug(true);
        console.log('[Natively] CDN script loaded');
      }
    </script>
    <script async onload="nativelyOnLoad()" src="https://cdn.jsdelivr.net/npm/natively@3.1.3/natively-frontend.min.js"></script>
    
    <!-- OneSignal Web SDK for Push Notifications (browser fallback) -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      
      // Fetch OneSignal App ID from server config
      fetch('/api/config/onesignal')
        .then(function(res) { return res.json(); })
        .then(function(config) {
          if (config.appId) {
            console.log('[OneSignal] App ID loaded from server');
            initOneSignal(config.appId);
          } else {
            console.warn('[OneSignal] No App ID configured');
          }
        })
        .catch(function(err) {
          console.error('[OneSignal] Failed to load config:', err);
        });
      
      function initOneSignal(appId) {
        // Prevent double initialization
        if (window.OneSignalInitialized) {
          console.log('[OneSignal] Already initialized, skipping');
          return;
        }
        
        OneSignalDeferred.push(async function(OneSignal) {
          try {
            // Enable debug logging to see detailed errors
            OneSignal.Debug.setLogLevel('trace');
            
            await OneSignal.init({
              appId: appId,
              allowLocalhostAsSecureOrigin: true,
            });
            console.log('[OneSignal] SDK initialized successfully');
            window.OneSignalReady = true;
            window.OneSignalInitialized = true;
            window.dispatchEvent(new CustomEvent('onesignalReady'));
          } catch (err) {
            console.error('[OneSignal] Init error:', err);
            console.error('[OneSignal] Error message:', err && err.message);
            console.error('[OneSignal] Error details:', JSON.stringify(err, Object.getOwnPropertyNames(err)));
          }
        });
      }
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fira+Code:wght@300..700&family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@100..900&family=Oxanium:wght@200..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
