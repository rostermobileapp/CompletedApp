<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    
    <!-- Natively.io SDK for native app features (push notifications, etc.) -->
    <script async onload="nativelyOnLoad()" src="https://cdn.jsdelivr.net/npm/natively@3.1.3/natively-frontend.min.js"></script>
    <script>
      // Track Natively SDK state
      window.nativelyLoaded = false;
      window.isNativelyApp = false;
      
      function nativelyOnLoad() {
        console.log('[Natively] SDK script loaded');
        window.nativelyLoaded = true;
        
        // Enable debug mode to see errors
        if (window.natively) {
          window.natively.setDebug(true);
          console.log('[Natively] Debug mode enabled');
        }
        
        // Check if running in native app using NativelyInfo
        try {
          if (typeof NativelyInfo !== 'undefined') {
            var info = new NativelyInfo();
            var browserInfo = info.browserInfo();
            window.isNativelyApp = browserInfo.isNativeApp === true;
            console.log('[Natively] browserInfo:', browserInfo);
            console.log('[Natively] isNativeApp:', window.isNativelyApp);
          }
        } catch (e) {
          console.log('[Natively] Error checking browserInfo:', e);
        }
        
        // Dispatch event for React to know SDK is ready
        window.dispatchEvent(new CustomEvent('nativelyReady', { detail: { isNativeApp: window.isNativelyApp } }));
      }
      
      // Fallback check if onload doesn't fire
      var nativelyCheckCount = 0;
      var nativelyCheckInterval = setInterval(function() {
        nativelyCheckCount++;
        
        // Check for various Natively SDK indicators
        var hasNatively = typeof window.natively !== 'undefined';
        var hasNativelyNotifications = typeof window.NativelyNotifications !== 'undefined';
        var hasNativelyInfo = typeof window.NativelyInfo !== 'undefined';
        
        if (hasNatively || hasNativelyNotifications || hasNativelyInfo) {
          window.nativelyLoaded = true;
          console.log('[Natively] SDK detected on check ' + nativelyCheckCount + 
            ' - natively:', hasNatively + 
            ', NativelyNotifications:', hasNativelyNotifications +
            ', NativelyInfo:', hasNativelyInfo);
          
          // Try to detect native app
          if (hasNativelyInfo) {
            try {
              var info = new NativelyInfo();
              var browserInfo = info.browserInfo();
              window.isNativelyApp = browserInfo.isNativeApp === true;
              console.log('[Natively] isNativeApp:', window.isNativelyApp);
            } catch (e) {}
          }
          
          window.dispatchEvent(new CustomEvent('nativelyReady', { detail: { isNativeApp: window.isNativelyApp } }));
          clearInterval(nativelyCheckInterval);
        } else if (nativelyCheckCount > 50) {
          console.log('[Natively] SDK not available after 5s, likely running in browser');
          clearInterval(nativelyCheckInterval);
        }
      }, 100);
    </script>
    
    <!-- OneSignal Web SDK for Push Notifications (browser fallback) -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      
      // Fetch OneSignal App ID from server config
      fetch('/api/config/onesignal')
        .then(function(res) { return res.json(); })
        .then(function(config) {
          if (config.appId) {
            console.log('[OneSignal] App ID loaded from server');
            initOneSignal(config.appId);
          } else {
            console.warn('[OneSignal] No App ID configured');
          }
        })
        .catch(function(err) {
          console.error('[OneSignal] Failed to load config:', err);
        });
      
      function initOneSignal(appId) {
        // Prevent double initialization
        if (window.OneSignalInitialized) {
          console.log('[OneSignal] Already initialized, skipping');
          return;
        }
        
        OneSignalDeferred.push(async function(OneSignal) {
          try {
            // Enable debug logging to see detailed errors
            OneSignal.Debug.setLogLevel('trace');
            
            await OneSignal.init({
              appId: appId,
              allowLocalhostAsSecureOrigin: true,
            });
            console.log('[OneSignal] SDK initialized successfully');
            window.OneSignalReady = true;
            window.OneSignalInitialized = true;
            window.dispatchEvent(new CustomEvent('onesignalReady'));
          } catch (err) {
            console.error('[OneSignal] Init error:', err);
            console.error('[OneSignal] Error message:', err && err.message);
            console.error('[OneSignal] Error details:', JSON.stringify(err, Object.getOwnPropertyNames(err)));
          }
        });
      }
    </script>
